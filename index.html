<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <!-- Viewport & Standalone App Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F8F4E8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>WaterTracker</title>
    
    <style>
        :root {
            --bg-color: #F8F4E8;
            --card-bg: #FFFFFF;
            --text-color: #2D3748;
            --primary-blue: #00A8FF;
            --water-level: #34ACE0;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: calc(15px + env(safe-area-inset-top)) 15px 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Goal Controller */
        .goal-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .goal-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .goal-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background-color: #E2E8F0;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-circle:active {
            transform: scale(0.95);
        }

        .goal-value {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary-blue);
            min-width: 55px;
            text-align: center;
        }

        /* Water Visual */
        .visual-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .drop-wrapper {
            position: relative;
            width: 160px;
            height: 200px;
        }

        .drop-svg {
            width: 100%;
            height: 100%;
        }

        .amount-display {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-blue);
            background: #EBF8FF;
            padding: 8px 24px;
            border-radius: 30px;
        }

        /* Quick Add Grid */
        .section-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: -10px;
        }

        .drink-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .drink-btn {
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: all 0.1s ease;
        }

        .drink-btn:active {
            transform: scale(0.97);
            border-color: var(--primary-blue);
        }

        .drink-icon {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: var(--primary-blue);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .drink-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .drink-size {
            font-size: 0.8rem;
            color: #A0AEC0;
        }

        /* Bottom Nav & Views */
        .tab-content {
            display: none;
            width: 100%;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom)) 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .nav-btn {
            border: none;
            background: none;
            font-weight: 700;
            font-size: 0.95rem;
            color: #A0AEC0;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .nav-btn.active {
            color: var(--primary-blue);
            background: #EBF8FF;
        }

        /* Calendar / Streaks */
        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .day-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #A0AEC0;
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            background: #F7FAFC;
        }

        .day-cell.completed {
            background: #48BB78;
            color: white;
        }

        .day-cell.partial {
            background: #ECC94B;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- HYDRATATIE TAB -->
        <div id="tab-hydratatie" class="tab-content active">
            
            <div class="goal-card">
                <span class="goal-title">Dagdoel</span>
                <div class="goal-controls">
                    <button class="btn-circle" onclick="adjustGoal(-0.5)">-</button>
                    <span id="goal-display" class="goal-value">2.5 L</span>
                    <button class="btn-circle" onclick="adjustGoal(0.5)">+</button>
                </div>
            </div>

            <div class="visual-card">
                <div class="drop-wrapper">
                    <svg class="drop-svg" viewBox="0 0 100 120">
                        <defs>
                            <clipPath id="drop-clip">
                                <path d="M50 0 C50 0 0 60 0 85 A50 50 0 0 0 100 85 C100 60 50 0 50 0 Z" />
                            </clipPath>
                        </defs>
                        <!-- Drop Background -->
                        <path d="M50 0 C50 0 0 60 0 85 A50 50 0 0 0 100 85 C100 60 50 0 50 0 Z" fill="#EBF8FF" />
                        <!-- Water Level Container -->
                        <g clip-path="url(#drop-clip)">
                            <rect id="water-fill" x="0" y="120" width="100" height="120" fill="#34ACE0" style="transition: y 0.4s ease;" />
                        </g>
                        <!-- Outline -->
                        <path d="M50 0 C50 0 0 60 0 85 A50 50 0 0 0 100 85 C100 60 50 0 50 0 Z" fill="none" stroke="#00A8FF" stroke-width="3" />
                    </svg>
                </div>

                <div class="amount-display">
                    <span id="current-display">0</span> / <span id="target-display">2500</span> ml
                </div>
            </div>

            <span class="section-title">Snel Toevoegen</span>
            
            <div class="drink-grid">
                <button class="drink-btn" onclick="addWater(250)">
                    <svg class="drink-icon" viewBox="0 0 24 24"><path d="M7 2h10l-1 18H8L7 2z"/></svg>
                    <span class="drink-name">Glas</span>
                    <span class="drink-size">250 ml</span>
                </button>
                <button class="drink-btn" onclick="addWater(450)">
                    <svg class="drink-icon" viewBox="0 0 24 24"><path d="M9 2h6v3H9V2z M8 5h8v15H8V5z"/></svg>
                    <span class="drink-name">Dopper</span>
                    <span class="drink-size">450 ml</span>
                </button>
                <button class="drink-btn" onclick="addWater(750)">
                    <svg class="drink-icon" viewBox="0 0 24 24"><path d="M10 2h4v2h-4V2z M7 6h10l-1 14H8L7 6z"/></svg>
                    <span class="drink-name">Bidon</span>
                    <span class="drink-size">750 ml</span>
                </button>
                <button class="drink-btn" onclick="addWater(600)">
                    <svg class="drink-icon" viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="2"/></svg>
                    <span class="drink-name">Shaker</span>
                    <span class="drink-size">600 ml</span>
                </button>
                <button class="drink-btn" onclick="addWater(330)">
                    <svg class="drink-icon" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="3"/></svg>
                    <span class="drink-name">Blikje</span>
                    <span class="drink-size">330 ml</span>
                </button>
                <button class="drink-btn" onclick="addWater(500)">
                    <svg class="drink-icon" viewBox="0 0 24 24"><path d="M10 2h4v3h-4V2z M8 8h8l-1 12H9L8 8z"/></svg>
                    <span class="drink-name">Flesje</span>
                    <span class="drink-size">500 ml</span>
                </button>
            </div>

            <button class="drink-btn" style="width: 100%; border-color: #FEB2B2; background: #FFF5F5;" onclick="resetToday()">
                <span class="drink-name" style="color: #E53E3E;">Reset Vandaag</span>
            </button>

        </div>

        <!-- KALENDER TAB -->
        <div id="tab-kalender" class="tab-content">
            <div class="calendar-card">
                <span class="section-title">Maandoverzicht</span>
                <div class="calendar-grid" id="calendar-cells">
                    <!-- Javascript populates cells -->
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <button id="nav-hydratatie" class="nav-btn active" onclick="switchTab('hydratatie')">Hydratatie</button>
        <button id="nav-kalender" class="nav-btn" onclick="switchTab('kalender')">Kalender</button>
    </div>

    <script>
        let goalLiters = parseFloat(localStorage.getItem('water_goal')) || 2.5;
        let logs = JSON.parse(localStorage.getItem('water_logs')) || {};

        function getTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function init() {
            const today = getTodayKey();
            if (!logs[today]) {
                logs[today] = 0;
            }
            updateUI();
            renderCalendar();
        }

        function updateUI() {
            const today = getTodayKey();
            const currentMl = logs[today] || 0;
            const targetMl = goalLiters * 1000;

            document.getElementById('goal-display').innerText = goalLiters.toFixed(1) + ' L';
            document.getElementById('current-display').innerText = currentMl;
            document.getElementById('target-display').innerText = targetMl;

            // Update water drop animation (0 to 120 px fill)
            const percentage = Math.min(currentMl / targetMl, 1);
            const fillY = 120 - (percentage * 120);
            document.getElementById('water-fill').setAttribute('y', fillY);

            localStorage.setItem('water_goal', goalLiters);
            localStorage.setItem('water_logs', JSON.stringify(logs));
        }

        function addWater(amount) {
            const today = getTodayKey();
            logs[today] = (logs[today] || 0) + amount;
            updateUI();
            renderCalendar();
        }

        function resetToday() {
            const today = getTodayKey();
            logs[today] = 0;
            updateUI();
            renderCalendar();
        }

        function adjustGoal(delta) {
            goalLiters = Math.max(0.5, goalLiters + delta);
            updateUI();
            renderCalendar();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-cells');
            grid.innerHTML = '';

            const days = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
            days.forEach(d => {
                const label = document.createElement('div');
                label.className = 'day-label';
                label.innerText = d;
                grid.appendChild(label);
            });

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();

            const firstDay = new Date(year, month, 1);
            let startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0

            for (let i = 0; i < startOffset; i++) {
                grid.appendChild(document.createElement('div'));
            }

            const totalDays = new Date(year, month + 1, 0).getDate();
            const targetMl = goalLiters * 1000;

            for (let day = 1; day <= totalDays; day++) {
                const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const logged = logs[key] || 0;

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.innerText = day;

                if (logged >= targetMl) {
                    cell.classList.add('completed');
                } else if (logged > 0) {
                    cell.classList.add('partial');
                }

                grid.appendChild(cell);
            }
        }

        init();
    </script>
</body>
</html>
