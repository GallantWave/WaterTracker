<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F8F4E8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Water Tracker</title>
    <style>
        :root {
            --bg-color: #F8F4E8;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --water-blue: #3498DB;
            --water-light: #EBF5FB;
            --accent-green: #2ECC71;
            --accent-yellow: #F1C40F;
            --accent-orange: #E67E22;
            --accent-purple: #9B59B6;
            --accent-pink: #E84393;
            --radius-large: 24px;
            --radius-small: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: calc(15px + env(safe-area-inset-top)) 16px 90px 16px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Goal Header */
        .goal-container {
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: var(--radius-large);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .goal-title {
            font-weight: 800;
            font-size: 1.1rem;
            color: #576574;
        }

        .goal-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--water-light);
            color: var(--water-blue);
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .btn-btn:active {
            transform: scale(0.9);
        }

        .goal-value {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--water-blue);
            min-width: 60px;
            text-align: center;
        }

        /* Water Drop Visual */
        .drop-card {
            background: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .drop-svg-container {
            width: 170px;
            height: 210px;
            position: relative;
        }

        .drop-svg {
            width: 100%;
            height: 100%;
        }

        .status-pill {
            background: var(--water-light);
            color: var(--water-blue);
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 1.4rem;
            font-weight: 800;
        }

        /* Quick Add Grid */
        .section-header {
            font-size: 1.1rem;
            font-weight: 800;
            color: #576574;
        }

        .drink-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .drink-card {
            background: var(--card-bg);
            border: none;
            border-radius: var(--radius-large);
            padding: 18px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.03);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .drink-card:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-small);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-box svg {
            width: 26px;
            height: 26px;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Specific Drink Colors */
        .bg-glas { background: #E3F2FD; } .icon-glas svg { stroke: #1E88E5; }
        .bg-dopper { background: #FFE0B2; } .icon-dopper svg { stroke: #FB8C00; }
        .bg-bidon { background: #E8F5E9; } .icon-bidon svg { stroke: #43A047; }
        .bg-shaker { background: #F3E5F5; } .icon-shaker svg { stroke: #AB47BC; }
        .bg-blikje { background: #FFFDE7; } .icon-blikje svg { stroke: #FDD835; }
        .bg-flesje { background: #FCE4EC; } .icon-flesje svg { stroke: #F06292; }

        .drink-title {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text-main);
        }

        .drink-volume {
            font-size: 0.85rem;
            font-weight: 700;
            color: #A0AEC0;
        }

        /* Tabs & Bottom Navigation */
        .tab-panel {
            display: none;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .tab-panel.active {
            display: flex;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom)) 20px;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.04);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }

        .nav-item {
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 800;
            color: #A0AEC0;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: var(--water-blue);
            background: var(--water-light);
        }

        /* Calendar Styling */
        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--radius-large);
            padding: 24px 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 16px;
            text-align: center;
        }

        .day-header {
            font-size: 0.85rem;
            font-weight: 800;
            color: #A0AEC0;
        }

        .cal-day {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            background: #F7FAFC;
            color: #718096;
        }

        .cal-day.done {
            background: var(--accent-green);
            color: #FFFFFF;
        }

        .cal-day.half {
            background: var(--accent-yellow);
            color: #FFFFFF;
        }

        .reset-btn {
            background: #FFEBEE;
            color: #E53935;
            border: none;
            padding: 14px;
            border-radius: var(--radius-large);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HYDRATATIE TAB -->
        <div id="panel-hydratatie" class="tab-panel active">
            
            <div class="goal-container">
                <span class="goal-title">Dagdoel</span>
                <div class="goal-controls">
                    <button class="btn-btn" onclick="updateGoal(-0.5)">-</button>
                    <span id="goal-lbl" class="goal-value">2.5 L</span>
                    <button class="btn-btn" onclick="updateGoal(0.5)">+</button>
                </div>
            </div>

            <div class="drop-card">
                <div class="drop-svg-container">
                    <svg class="drop-svg" viewBox="0 0 100 120">
                        <defs>
                            <clipPath id="drop-shape">
                                <path d="M50 0 C50 0 0 60 0 85 A50 50 0 0 0 100 85 C100 60 50 0 50 0 Z" />
                            </clipPath>
                        </defs>
                        <!-- Back drop -->
                        <path d="M50 0 C50 0 0 60 0 85 A50 50 0 0 0 100 85 C100 60 50 0 50 0 Z" fill="#EBF5FB" />
                        <!-- Water level -->
                        <g clip-path="url(#drop-shape)">
                            <rect id="water-fill" x="0" y="120" width="100" height="120" fill="#3498DB" style="transition: y 0.4s ease;" />
                        </g>
                        <!-- Border -->
                        <path d="M50 0 C50 0 0 60 0 85 A50 50 0 0 0 100 85 C100 60 50 0 50 0 Z" fill="none" stroke="#2980B9" stroke-width="2.5" />
                    </svg>
                </div>

                <div class="status-pill">
                    <span id="curr-ml">0</span> / <span id="targ-ml">2500</span> ml
                </div>
            </div>

            <span class="section-header">Snel Toevoegen</span>

            <div class="drink-grid">
                <button class="drink-card" onclick="addWater(250)">
                    <div class="icon-box bg-glas icon-glas">
                        <svg viewBox="0 0 24 24"><path d="M7 2h10l-1 18H8L7 2z"/></svg>
                    </div>
                    <span class="drink-title">Glas</span>
                    <span class="drink-volume">250 ml</span>
                </button>

                <button class="drink-card" onclick="addWater(450)">
                    <div class="icon-box bg-dopper icon-dopper">
                        <svg viewBox="0 0 24 24"><path d="M9 2h6v3H9V2z M8 5h8v15H8V5z"/></svg>
                    </div>
                    <span class="drink-title">Dopper</span>
                    <span class="drink-volume">450 ml</span>
                </button>

                <button class="drink-card" onclick="addWater(750)">
                    <div class="icon-box bg-bidon icon-bidon">
                        <svg viewBox="0 0 24 24"><path d="M10 2h4v2h-4V2z M7 6h10l-1 14H8L7 6z"/></svg>
                    </div>
                    <span class="drink-title">Bidon</span>
                    <span class="drink-volume">750 ml</span>
                </button>

                <button class="drink-card" onclick="addWater(600)">
                    <div class="icon-box bg-shaker icon-shaker">
                        <svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="2"/></svg>
                    </div>
                    <span class="drink-title">Shaker</span>
                    <span class="drink-volume">600 ml</span>
                </button>

                <button class="drink-card" onclick="addWater(330)">
                    <div class="icon-box bg-blikje icon-blikje">
                        <svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="3"/></svg>
                    </div>
                    <span class="drink-title">Blikje</span>
                    <span class="drink-volume">330 ml</span>
                </button>

                <button class="drink-card" onclick="addWater(500)">
                    <div class="icon-box bg-flesje icon-flesje">
                        <svg viewBox="0 0 24 24"><path d="M10 2h4v3h-4V2z M8 8h8l-1 12H9L8 8z"/></svg>
                    </div>
                    <span class="drink-title">Flesje</span>
                    <span class="drink-volume">500 ml</span>
                </button>
            </div>

            <button class="reset-btn" onclick="resetDay()">Reset Vandaag</button>

        </div>

        <!-- KALENDER TAB -->
        <div id="panel-kalender" class="tab-panel">
            <div class="calendar-card">
                <span class="section-header">Maandoverzicht</span>
                <div class="calendar-grid" id="cal-grid"></div>
            </div>
        </div>

    </div>

    <!-- Bottom Nav Bar -->
    <div class="bottom-nav">
        <button id="nav-hydr" class="nav-item active" onclick="showTab('hydratatie')">Hydratatie</button>
        <button id="nav-kal" class="nav-item" onclick="showTab('kalender')">Kalender</button>
    </div>

    <script>
        let currentGoal = parseFloat(localStorage.getItem('wt_goal')) || 2.5;
        let waterData = JSON.parse(localStorage.getItem('wt_data')) || {};

        function getToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function initApp() {
            const today = getToday();
            if (waterData[today] === undefined) {
                waterData[today] = 0;
            }
            renderUI();
            buildCalendar();
        }

        function renderUI() {
            const today = getToday();
            const logged = waterData[today] || 0;
            const target = currentGoal * 1000;

            document.getElementById('goal-lbl').innerText = currentGoal.toFixed(1) + ' L';
            document.getElementById('curr-ml').innerText = logged;
            document.getElementById('targ-ml').innerText = target;

            // Animate Drop Fill
            const ratio = Math.min(logged / target, 1);
            const fillPos = 120 - (ratio * 120);
            document.getElementById('water-fill').setAttribute('y', fillPos);

            localStorage.setItem('wt_goal', currentGoal);
            localStorage.setItem('wt_data', JSON.stringify(waterData));
        }

        function addWater(amount) {
            const today = getToday();
            waterData[today] = (waterData[today] || 0) + amount;
            renderUI();
            buildCalendar();
        }

        function resetDay() {
            const today = getToday();
            waterData[today] = 0;
            renderUI();
            buildCalendar();
        }

        function updateGoal(delta) {
            currentGoal = Math.max(0.5, currentGoal + delta);
            renderUI();
            buildCalendar();
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`panel-${tab}`).classList.add('active');
            if(tab === 'hydratatie') document.getElementById('nav-hydr').classList.add('active');
            if(tab === 'kalender') document.getElementById('nav-kal').classList.add('active');
        }

        function buildCalendar() {
            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';

            const dayNames = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
            dayNames.forEach(name => {
                const h = document.createElement('div');
                h.className = 'day-header';
                h.innerText = name;
                grid.appendChild(h);
            });

            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth();

            const firstDay = new Date(y, m, 1);
            let offset = (firstDay.getDay() + 6) % 7; // Maandag start

            for (let i = 0; i < offset; i++) {
                grid.appendChild(document.createElement('div'));
            }

            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const target = currentGoal * 1000;

            for (let d = 1; d <= daysInMonth; d++) {
                const dateKey = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const val = waterData[dateKey] || 0;

                const cell = document.createElement('div');
                cell.className = 'cal-day';
                cell.innerText = d;

                if (val >= target) {
                    cell.classList.add('done');
                } else if (val > 0) {
                    cell.classList.add('half');
                }

                grid.appendChild(cell);
            }
        }

        initApp();
    </script>
</body>
</html>
